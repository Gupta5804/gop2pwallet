worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;

    upstream users {
        server user-service:8080;
    }
    upstream wallets {
        server wallet-service:8081;
    }
    upstream transactions {
        server transaction-service:8082;
    }
    upstream notifications {
        server notification-service:8083;
    }

    server {
        listen 80;
        
        # --- CORS CONFIGURATION ---
        # Allow requests from any origin (for simplicity in this project)
        # In a strict production, replace '*' with your Vercel domain
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # Handle Preflight requests (OPTIONS)
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        location /api/v1/auth {
            proxy_pass http://users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/users {
            proxy_pass http://users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/wallet {
            proxy_pass http://wallets;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/transactions {
            proxy_pass http://transactions;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ws {
            proxy_pass http://notifications;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
        
        # Note: We removed the 'location /' block because Nginx is 
        # NOT serving the frontend files anymore. Vercel does that.
    }
}