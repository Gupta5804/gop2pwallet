# nginx.conf

worker_processes 1; # Defines how many worker processes NGINX should run.
# usually 1 or 'auto'
events {
    worker_connections 1024; # Max connections per worker process
    # usually 1024
}

http {
    sendfile on; # Enables efficient file sending

    # Define named locations (upstreams) for each of your backend services
    # The names match the service names in docker-compose.yml
    upstream users {
        server user-service:8080;
    }
    upstream wallets {
        server wallet-service:8081;
    }
    upstream transactions {
        server transaction-service:8082;
    }
    upstream notifications {
        server notification-service:8083;
    }
    upstream frontend {
        # Assumes frontend is running on port 3000
        server frontend:3000;
    }

    server {
        listen 80; # Listens on port 80

        # --- API routes ---
        # Requests starting with '/api/v1/users' will be forwarded to the 'users' upstream
        location /api/v1/auth {
            proxy_pass http://users; # Forward requests to the 'users' upstream
            #Standard headers to pass along client information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Requests starting with /api/v1/users/ go to the user-service
        location /api/v1/users {
            proxy_pass http://users;
            #Standard headers to pass along client information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme; 
        }

        # Requests starting with /api/v1/wallets/ go to the wallet-service
        location /api/v1/wallet {
            proxy_pass http://wallets;
            #Standard headers to pass along client information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Requests starting with /api/v1/transactions/ go to the transaction-service
        location /api/v1/transactions {
            proxy_pass http://transactions;
            #Standard headers to pass along client information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Websocket Route ---
        location /ws {
            proxy_pass http://notifications;
            # Required headers for WebSocket upgrade handshake
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_read_timeout 12h;
            proxy_send_timeout 12h;
        }

        # --- Frontend (Catch-all)---
        location / {
            proxy_pass http://frontend;
            #Standard headers to pass along client information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Required for Vite's Hot Module Replacement WebSocket in Dev mode 
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}