worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;

    # Upstreams (Consistent with local)
    upstream users {
        server user-service:8080;
    }
    upstream wallets {
        server wallet-service:8081;
    }
    upstream transactions {
        server transaction-service:8082;
    }
    upstream notifications {
        server notification-service:8083;
    }
    upstream frontend {
        # Matches docker-compose.yml (Dockerfile.dev exposes 3000)
        server frontend:3000;
    }

    # HTTP Redirect to HTTPS
    server {
        listen 80;
        server_name gop2pwallet.pp.ua www.gop2pwallet.pp.ua;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        server_name gop2pwallet.pp.ua www.gop2pwallet.pp.ua;

        # SSL Certs
        ssl_certificate /etc/letsencrypt/live/gop2pwallet.pp.ua/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gop2pwallet.pp.ua/privkey.pem;

        # --- API routes (Consistent with local) ---
        location /api/v1/auth {
            proxy_pass http://users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/users {
            proxy_pass http://users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/wallet {
            proxy_pass http://wallets;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/transactions {
            proxy_pass http://transactions;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Websocket Route (Consistent with local) ---
        location /ws {
            proxy_pass http://notifications;
            # Required headers for WebSocket upgrade handshake
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_read_timeout 12h;
            proxy_send_timeout 12h;
        }

        # --- Health Check Routes (Added from local) ---
        location /health/user {
            rewrite ^/health/user(.*)$ /health break;
            proxy_pass http://user-service:8080;
        }

        location /health/wallet {
            rewrite ^/health/wallet(.*)$ /health break;
            proxy_pass http://wallet-service:8081;
        }

        location /health/transaction {
            rewrite ^/health/transaction(.*)$ /health break;
            proxy_pass http://transaction-service:8082;
        }

        location /health/notification {
            rewrite ^/health/notification(.*)$ /health break;
            proxy_pass http://notification-service:8083;
        }

        # --- Frontend (Consistent with local) ---
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket support for frontend if needed
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}