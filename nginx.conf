worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;

    # Upstreams
    upstream frontend { 
        server frontend:80; 
    }
    upstream users { 
        server user-service:8080; 
    }
    upstream wallets { 
        server wallet-service:8081; 
    }
    upstream transactions { 
        server transaction-service:8082; 
    }
    upstream notifications { 
        server notification-service:8083; 
    }

    # HTTP Redirect to HTTPS
    server {
        listen 80;
        server_name gopaywallet.site www.gopaywallet.site; # REPLACE WITH YOUR DOMAIN
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        server_name gopaywallet.site www.gopaywallet.site; # REPLACE WITH YOUR DOMAIN

        # SSL Certs (Generate these for the ROOT domain)
        ssl_certificate /etc/letsencrypt/live/gopaywallet.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gopaywallet.site/privkey.pem;

        # --- FRONTEND (Root) ---
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- API Routes ---
        location /api/v1/auth {
            proxy_pass http://users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/users {
            proxy_pass http://users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/wallet {
            proxy_pass http://wallets;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/transactions {
            proxy_pass http://transactions;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- WebSocket ---
        location /ws {
            proxy_pass http://notifications;
            proxy_http_version 1.1;
            proxy_set_header Upgrade "websocket";
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }
    }
}