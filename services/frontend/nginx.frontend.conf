server {
    listen 80;
    
    # Serve from the correct folder
    root /usr/share/nginx/html;
    index index.html;

    # 1. Handle static assets (cache them efficiently)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }

    # 2. The SPA Fix: Redirect everything else to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}